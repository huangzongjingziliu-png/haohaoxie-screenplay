[package]
name = "screenplay-desktop"
version = "0.1.35"
edition = "2021"
license = "MIT"

[lib]
name = "screenplay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
screenplay-core = { path = "../crates/screenplay-core" }
screenplay-store = { path = "../crates/screenplay-store" }
screenplay-import = { path = "../crates/screenplay-import" }
screenplay-export = { path = "../crates/screenplay-export" }
screenplay-agent = { path = "../crates/screenplay-agent" }
tokio = { version = "1", features = ["full"] }
dirs = "6"
ts-rs = { version = "11", features = ["serde-compat"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
ring = "0.17"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
