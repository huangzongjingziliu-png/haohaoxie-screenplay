[workspace]
resolver = "2"
members = [
    "crates/screenplay-core",
    "crates/screenplay-store",
    "crates/screenplay-import",
    "crates/screenplay-export",
    "crates/screenplay-agent",
    "crates/screenplay-mcp",
    "crates/screenplay-cli",
    "src-tauri",
    "crates/screenplay-testtool",
    # "apps/desktop/src-tauri",  # Loop 7: Tauri GUI — re-add when implemented
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Screenplay Workbench"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "5", default-features = false, features = ["deflate", "time"] }
walkdir = "2"
regex = "1"
similar = "2"
printpdf = { version = "0.8", default-features = false }
lopdf = "0.36"
quick-xml = { version = "0.38", features = ["serialize"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
ts-rs = { version = "11", features = ["serde-compat", "uuid-impl", "chrono-impl"] }
