[dependencies]
screenplay-core = { path = "../screenplay-core" }
screenplay-store = { path = "../screenplay-store" }
screenplay-import = { path = "../screenplay-import" }
screenplay-export = { path = "../screenplay-export" }
screenplay-agent = { path = "../screenplay-agent" }
